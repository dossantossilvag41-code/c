<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Eu te amo ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    .heart {
        width: 120px;
        height: 120px;
        background: red;
        position: relative;
        transform: rotate(-45deg);
        animation: beat 1s infinite;
        margin-bottom: 30px;
    }

    .heart::before,
    .heart::after {
        content: "";
        width: 120px;
        height: 120px;
        background: red;
        border-radius: 50%;
        position: absolute;
    }

    .heart::before {
        top: -60px;
        left: 0;
    }

    .heart::after {
        left: 60px;
        top: 0;
    }

    @keyframes beat {
        0% { transform: scale(1) rotate(-45deg); }
        50% { transform: scale(1.15) rotate(-45deg); }
        100% { transform: scale(1) rotate(-45deg); }
    }

    h1 {
        color: red;
        font-size: 28px;
        animation: pulse 1s infinite;
    }

    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.7; }
        100% { opacity: 1; }
    }
</style>
</head>

<body>

<div class="heart"></div>
<h1>Eu te amo, amor ❤️</h1>

</body>
</html>
